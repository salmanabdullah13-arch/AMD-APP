# Stage 9 (merged roadmap, 6 Aug 2026) — the offline e2e sweep on every
# push. The sweep caught two real bugs in a single day when run by hand;
# this makes it automatic. Live-Supabase suites (cloud*/rls/signup/
# role-gating/roster-filter/age-gate) and direct-landing (needs live
# user_types) are excluded — they exercise the real project with shared
# fixture accounts and belong to a supervised session, not CI.
name: offline-e2e
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run offline e2e suites
        run: |
          set -u
          fail=0
          for t in $(ls e2e-*.js | grep -vE 'cloud|rls|signup-approval|role-gating|roster-filter|age-gate|direct-landing'); do
            echo "::group::$t"
            if node "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$t failed"
              fail=1
            fi
          done
          exit $fail
